name: Build VideoCraft APK

on:
  push:
    branches: [ "main", "master", "principal" ]
  pull_request:
    branches: [ "main", "master", "principal" ]
  workflow_dispatch:

env:
  ACTIONS_RUNNER_FORCE_NODE24: "false"
  ACTIONS_ALLOW_USE_UNSECURE_NODE_VERSION: "true"
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Compilar APK de VideoCraft
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Optimizar y configurar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Aceptar licencias de Android SDK sin sdkmanager roto
        run: |
          mkdir -p "$ANDROID_HOME/licenses" || true
          printf "8933bad161af4178b1185d1a37fbf41ea5269c55\nd56f5187479451eabf01fb78af6dfcb131a6481e\n24333f8a63b6825ea9c5514f83c2829b004d1fee\n" > "$ANDROID_HOME/licenses/android-sdk-license"
          printf "84831b9409646a918e30573bab4c9c91346d8abd\n" > "$ANDROID_HOME/licenses/android-sdk-preview-license"
          printf "601085b94cd77f0b54ff864069570991500085d7\n" > "$ANDROID_HOME/licenses/android-googletv-license"

      - name: Preparar .env y Keystore de depuración
        run: |
          if [ ! -f .env ]; then
            cp .env.example .env
          fi
          if [ -f debug.keystore.base64 ]; then
            base64 -d debug.keystore.base64 > debug.keystore
          else
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          fi
          chmod +x gradlew || true

      - name: Compilar APK (assembleDebug)
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir artefacto APK generado
        uses: actions/upload-artifact@v4
        with:
          name: VideoCraft-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
